name: Build AetherOS Bootable ISO

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag (leave blank to auto-generate timestamp tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish ISO + Windows Double-Click Installer to GitHub Releases'
        type: boolean
        default: true
  push:
    paths:
      - 'os-src/**'
      - '*source-bundle*.sh'
      - '.github/workflows/build-aetheros-iso.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-iso:
    name: Build AetherOS 1.0 LTS (x86_64 UEFI + BIOS ISO)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Free GitHub runner disk space for Debian rootfs + SquashFS
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Debian ISO build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            shim-signed \
            grub-efi-amd64-signed

      - name: Prepare AetherOS source tree (auto-detect or standalone bootstrap)
        id: prep
        run: |
          set -euo pipefail
          EXISTING_BUILD="$(find . -maxdepth 4 -type f -name 'build-iso.sh' ! -path './.git/*' | head -n 1 || true)"
          EXISTING_BUNDLE="$(find . -maxdepth 3 -type f -name '*source-bundle*.sh' ! -path './.git/*' | head -n 1 || true)"

          if [[ -n "${EXISTING_BUILD}" ]]; then
            BUILD_DIR="$(dirname "${EXISTING_BUILD}")"
            BUILD_ROOT="$(dirname "${BUILD_DIR}")"
            echo "Found existing build-iso.sh in ${BUILD_ROOT}"
            echo "BUILD_ROOT=${BUILD_ROOT}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${EXISTING_BUNDLE}" ]]; then
            echo "Extracting uploaded bundle: ${EXISTING_BUNDLE}"
            bash "${EXISTING_BUNDLE}"
            echo "BUILD_ROOT=aetheros-src" >> "$GITHUB_OUTPUT"
          else
            echo "No external os-src/ or bundle uploaded — bootstrapping standalone AetherOS builder inline..."
            mkdir -p aetheros-src/build aetheros-src/installer aetheros-src/drivers aetheros-src/storage aetheros-src/security

            cat <<'GRUB_EOF' > aetheros-src/build/grub.cfg
          set default=0
          set timeout=5
          menuentry "AetherOS 1.0 LTS (Live Desktop & Installer)" {
              linux /live/vmlinuz boot=live components quiet splash
              initrd /live/initrd.img
          }
          menuentry "AetherOS 1.0 LTS (Safe Graphics Mode)" {
              linux /live/vmlinuz boot=live components nomodeset
              initrd /live/initrd.img
          }
          GRUB_EOF

            cat <<'NFT_EOF' > aetheros-src/security/nftables.conf
          #!/usr/sbin/nft -f
          flush ruleset
          table inet filter {
              chain input {
                  type filter hook input priority 0; policy drop;
                  iif lo accept
                  ct state established,related accept
                  ip protocol icmp accept
                  ip6 nexthdr icmpv6 accept
              }
              chain forward { type filter hook forward priority 0; policy drop; }
              chain output { type filter hook output priority 0; policy accept; }
          }
          NFT_EOF

            cat <<'BAT_EOF' > aetheros-src/installer/Install-AetherOS-DoubleClick.bat
          @echo off
          title AetherOS 1.0 LTS - Windows Double-Click Installer (No Pendrive)
          color 0B
          net session >nul 2>&1
          if %errorlevel% neq 0 (
              echo Requesting Windows Administrator permission ^(UAC^)...
              powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath '%~f0' -Verb RunAs"
              exit /b
          )
          cls
          echo ============================================================================
          echo   AetherOS 1.0 LTS - Direct Windows-to-Linux Installer ^(No USB Pendrive^)
          echo ============================================================================
          echo.
          set "SCRIPT_DIR=%~dp0"
          if "%SCRIPT_DIR:~-1%"=="\" set "SCRIPT_DIR=%SCRIPT_DIR:~0,-1%"
          set "PS_ENGINE=%SCRIPT_DIR%\AetherOS-Windows-NoUSB-Installer.ps1"
          if not exist "%PS_ENGINE%" if exist "%SCRIPT_DIR%\AetherOS-Windows-NoUSB-Installer.ps1.txt" set "PS_ENGINE=%SCRIPT_DIR%\AetherOS-Windows-NoUSB-Installer.ps1.txt"
          echo Choose installation mode:
          echo   [1] Dual-Boot Alongside Windows 10/11 ^(Recommended - Keeps Windows safe^)
          echo   [2] Full Switch ^(Stage from C:\ without USB, replace Windows on reboot^)
          echo.
          set /p MODE_CHOICE="Enter 1 or 2 [default 1]: "
          if "%MODE_CHOICE%"=="" set "MODE_CHOICE=1"
          set "ALLOC_GB=60"
          if "%MODE_CHOICE%"=="1" (
              set /p ALLOC_INPUT="Space for AetherOS in GB [default 60]: "
              if not "%ALLOC_INPUT%"=="" set "ALLOC_GB=%ALLOC_INPUT%"
          )
          set "REPLACE_FLAG="
          if "%MODE_CHOICE%"=="2" set "REPLACE_FLAG=-ReplaceWindows"
          echo.
          set "TEMP_PS1=%TEMP%\AetherOS-NoUSB-Engine.ps1"
          if exist "%PS_ENGINE%" (
              copy /y "%PS_ENGINE%" "%TEMP_PS1%" >nul
          ) else (
              echo [ERROR] AetherOS-Windows-NoUSB-Installer.ps1 not found next to this .bat file.
              pause
              exit /b 1
          )
          powershell -NoProfile -ExecutionPolicy Bypass -File "%TEMP_PS1%" -IsoFolder "%SCRIPT_DIR%" -AllocateGB %ALLOC_GB% %REPLACE_FLAG%
          set "INSTALL_ERR=%errorlevel%"
          del /f /q "%TEMP_PS1%" >nul 2>&1
          echo.
          if %INSTALL_ERR% equ 0 (
              echo [DONE] AetherOS boot entry staged cleanly! Restart PC and choose AetherOS.
          ) else (
              echo [WARN] Installer exited with code %INSTALL_ERR%. Review the message above.
          )
          pause
          BAT_EOF

            cat <<'PS1_EOF' > aetheros-src/installer/AetherOS-Windows-NoUSB-Installer.ps1
          #Requires -RunAsAdministrator
          param(
            [int]$AllocateGB = 60,
            [switch]$ReplaceWindows,
            [string]$IsoFolder = "",
            [string]$IsoPath = ""
          )
          $ErrorActionPreference = "Stop"
          Write-Host "=== AetherOS 1.0 LTS - No-Pendrive Direct Installer (Windows -> Linux) ===" -ForegroundColor Cyan

          $searchDir = if ([string]::IsNullOrWhiteSpace($IsoFolder)) { $PSScriptRoot } else { $IsoFolder }
          if ([string]::IsNullOrWhiteSpace($IsoPath)) {
            $localIso = Get-ChildItem -Path $searchDir -Filter "aetheros-*.iso" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($localIso) {
              $IsoPath = $localIso.FullName
            } else {
              $dlIso = Get-ChildItem -Path "$env:USERPROFILE\Downloads" -Filter "aetheros-*.iso" -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dlIso) { $IsoPath = $dlIso.FullName }
            }
          }
          if ([string]::IsNullOrWhiteSpace($IsoPath) -or -not (Test-Path -LiteralPath $IsoPath)) {
            throw "AetherOS ISO not found! Place aetheros-1.0-lts-x86_64.iso in $searchDir and double-click again."
          }
          Write-Host "[OK] Found ISO: $IsoPath" -ForegroundColor Green

          $bcdCurrent = (& bcdedit /enum '{current}' 2>$null) -join "`n"
          $isUefi = ($env:firmware_type -eq "UEFI") -or ($bcdCurrent -match "winload\.efi")
          $cPart = Get-Partition -DriveLetter C
          $disk = Get-Disk -Number $cPart.DiskNumber
          $allParts = @(Get-Partition -DiskNumber $cPart.DiskNumber)
          Write-Host "[INFO] Firmware: $(if ($isUefi) { 'UEFI' } else { 'Legacy BIOS' }) | Disk $($disk.Number): $($disk.PartitionStyle) ($($allParts.Count) partitions)" -ForegroundColor Cyan

          function Restore-CDriveUnallocated {
            try {
              $sup = Get-PartitionSupportedSize -DriveLetter C
              $cur = Get-Partition -DriveLetter C
              if ($sup.SizeMax -gt ($cur.Size + [int64]50 * 1MB)) {
                $reclaimGB = [Math]::Round(($sup.SizeMax - $cur.Size) / 1GB, 2)
                Write-Host "[AUTO-FIX] Restoring ${reclaimGB} GB of unallocated space back into C:\ safely..." -ForegroundColor Yellow
                Resize-Partition -DriveLetter C -Size $sup.SizeMax
              }
            } catch {}
          }

          function Remove-OldAetherBcdEntries {
            try {
              $enumLines = & bcdedit /enum /v 2>$null
              $curId = $null
              foreach ($line in $enumLines) {
                if ($line -match '^\s*identifier\s+(\{[0-9a-fA-F\-]{36}\})\s*$') { $curId = $Matches[1] }
                elseif ($curId -and $line -match '^\s*description\s+.*AetherOS 1\.0 LTS') { & bcdedit /delete $curId /f | Out-Null; $curId = $null }
                elseif ([string]::IsNullOrWhiteSpace($line)) { $curId = $null }
              }
            } catch {}
          }

          $bl = Get-BitLockerVolume -MountPoint "C:" -ErrorAction SilentlyContinue
          if ($bl -and $bl.ProtectionStatus -eq "On") {
            throw "BitLocker is enabled on C:. Run 'Suspend-BitLocker -MountPoint C: -RebootCount 2' first."
          }
          powercfg /h off | Out-Null
          Write-Host "[OK] Disabled Windows Fast Startup (hiberfil.sys cleared)." -ForegroundColor Green

          function Mount-AetherIsoDrive {
            param([string]$Path)
            $existing = Get-DiskImage -ImagePath $Path -ErrorAction SilentlyContinue
            $weMounted = $false
            if (-not ($existing -and $existing.Attached)) {
              Mount-DiskImage -ImagePath $Path -ErrorAction Stop | Out-Null
              $weMounted = $true
            }
            $isoDrive = $null
            for ($i = 0; $i -lt 15; $i++) {
              $img = Get-DiskImage -ImagePath $Path -ErrorAction SilentlyContinue
              $vol = $img | Get-Volume -ErrorAction SilentlyContinue | Where-Object { $_.DriveLetter } | Select-Object -First 1
              if ($vol -and $vol.DriveLetter) {
                $candidate = "$($vol.DriveLetter):"
                if (Test-Path -LiteralPath "$candidate\") { $isoDrive = $candidate; break }
              }
              Start-Sleep -Milliseconds 800
            }
            if (-not $isoDrive) {
              if ($weMounted) { Dismount-DiskImage -ImagePath $Path -ErrorAction SilentlyContinue | Out-Null }
              throw "Could not read mounted ISO drive letter for $Path."
            }
            return @{ Drive = $isoDrive; WeMounted = $weMounted }
          }

          function Find-AetherIsoLiveFiles {
            param([string]$IsoDrive)
            $liveDir = "$IsoDrive\live"
            if (-not (Test-Path -LiteralPath $liveDir)) {
              $foundDir = Get-ChildItem -LiteralPath "$IsoDrive\" -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue | Where-Object { $_.Name -ieq "live" } | Select-Object -First 1
              if ($foundDir) { $liveDir = $foundDir.FullName }
            }
            if (-not (Test-Path -LiteralPath $liveDir)) {
              $rootItems = (Get-ChildItem -LiteralPath "$IsoDrive\" -Force -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join ', '
              throw "ISO at $IsoDrive is missing /live directory. Root contents: [$rootItems]"
            }
            $files = @(Get-ChildItem -LiteralPath $liveDir -File -Force -ErrorAction SilentlyContinue)
            $kernel = $files | Where-Object { $_.Name -ieq "vmlinuz" } | Select-Object -First 1
            if (-not $kernel) { $kernel = $files | Where-Object { $_.Name -imatch '^vmlinuz' } | Select-Object -First 1 }
            $initrd = $files | Where-Object { $_.Name -ieq "initrd.img" } | Select-Object -First 1
            if (-not $initrd) { $initrd = $files | Where-Object { $_.Name -imatch '^initrd' } | Select-Object -First 1 }
            $squash = $files | Where-Object { $_.Name -ieq "filesystem.squashfs" } | Select-Object -First 1
            if (-not $squash) { $squash = $files | Where-Object { $_.Name -imatch '\.(squashfs|squ)$' -or ($_.Name -imatch '^filesys' -and $_.Length -gt 10MB) } | Sort-Object Length -Descending | Select-Object -First 1 }
            if (-not $squash) { $squash = $files | Where-Object { $_.Length -gt 100MB } | Sort-Object Length -Descending | Select-Object -First 1 }
            if (-not $kernel -or -not $initrd -or -not $squash) {
              $foundList = ($files | ForEach-Object { "$($_.Name) ($([Math]::Round($_.Length/1MB,1)) MB)" }) -join ', '
              throw "ISO is missing required boot files in $liveDir. Found: [$foundList]"
            }
            return @{ LiveDir = $liveDir; Kernel = $kernel; Initrd = $initrd; Squash = $squash }
          }

          if (-not $isUefi) {
            Write-Host "[MODE] Legacy BIOS No-Partition Mode activated (works even with 4/4 MBR partitions)." -ForegroundColor Cyan
            Restore-CDriveUnallocated
            $cVol = Get-Volume -DriveLetter C
            if ($cVol.SizeRemaining -lt ([int64]2500 * 1MB)) { throw "Need at least 2.5 GB free on C:\." }
            $mountInfo = Mount-AetherIsoDrive -Path $IsoPath
            try {
              $isoDrive = $mountInfo.Drive
              $live = Find-AetherIsoLiveFiles -IsoDrive $isoDrive
              if (Test-Path -LiteralPath "C:\live") { Remove-Item -LiteralPath "C:\live" -Recurse -Force }
              New-Item -ItemType Directory -Path "C:\live" -Force | Out-Null
              Copy-Item -LiteralPath $live.Kernel.FullName -Destination "C:\live\vmlinuz" -Force
              Copy-Item -LiteralPath $live.Initrd.FullName -Destination "C:\live\initrd.img" -Force
              Copy-Item -LiteralPath $live.Squash.FullName -Destination "C:\live\filesystem.squashfs" -Force
              Get-ChildItem -LiteralPath "C:\live" -File -ErrorAction SilentlyContinue | ForEach-Object { $_.IsReadOnly = $false }
            } finally {
              if ($mountInfo.WeMounted) { Dismount-DiskImage -ImagePath $IsoPath -ErrorAction SilentlyContinue | Out-Null }
            }
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
            $tmpG4d = Join-Path $env:TEMP ("aether-g4d-" + [Guid]::NewGuid().ToString("N").Substring(0, 8))
            New-Item -ItemType Directory -Path $tmpG4d -Force | Out-Null
            try {
              $g4dArchive = Join-Path $tmpG4d "grub4dos.7z"
              Invoke-WebRequest -Uri "https://github.com/chenall/grub4dos/releases/download/2020-08-09-0da21fe/grub4dos-0.4.6a-2020-08-09.7z" -OutFile $g4dArchive -UseBasicParsing
              $sevenZip = if (Test-Path "C:\Program Files\7-Zip\7z.exe") { "C:\Program Files\7-Zip\7z.exe" } else {
                $z = Join-Path $tmpG4d "7zr.exe"
                Invoke-WebRequest -Uri "https://www.7-zip.org/a/7zr.exe" -OutFile $z -UseBasicParsing
                $z
              }
              $g4dExtract = Join-Path $tmpG4d "out"
              New-Item -ItemType Directory -Path $g4dExtract -Force | Out-Null
              & $sevenZip x "$g4dArchive" "-o$g4dExtract" -y | Out-Null
              $grldrSrc = Get-ChildItem -Path $g4dExtract -File -Recurse | Where-Object { $_.Name -eq "grldr" } | Select-Object -First 1
              $grldrMbrSrc = Get-ChildItem -Path $g4dExtract -File -Recurse | Where-Object { $_.Name -eq "grldr.mbr" } | Select-Object -First 1
              if ($grldrSrc) { Copy-Item -LiteralPath $grldrSrc.FullName -Destination "C:\grldr" -Force }
              if ($grldrMbrSrc) { Copy-Item -LiteralPath $grldrMbrSrc.FullName -Destination "C:\grldr.mbr" -Force } else {
                Invoke-WebRequest -Uri "https://raw.githubusercontent.com/pbatard/rufus/master/res/grub/grldr.mbr" -OutFile "C:\grldr.mbr" -UseBasicParsing
              }
            } finally {
              Remove-Item -LiteralPath $tmpG4d -Recurse -Force -ErrorAction SilentlyContinue
            }
            $ramBytes = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
            $defaultIdx = if ($ReplaceWindows -and ($ramBytes -ge ([int64]3500 * 1MB))) { 1 } else { 0 }
            $menuLines = @(
              "timeout 8", "default $defaultIdx", "",
              "title AetherOS 1.0 LTS (Live Desktop & Installer - Direct Boot)",
              "find --set-root --ignore-floppies /live/vmlinuz",
              "kernel /live/vmlinuz boot=live components quiet splash",
              "initrd /live/initrd.img", "",
              "title AetherOS 1.0 LTS (Full RAM Mode - Safe to Replace Windows)",
              "find --set-root --ignore-floppies /live/vmlinuz",
              "kernel /live/vmlinuz boot=live toram components quiet splash",
              "initrd /live/initrd.img", "",
              "title AetherOS 1.0 LTS (Safe Graphics Mode - nomodeset)",
              "find --set-root --ignore-floppies /live/vmlinuz",
              "kernel /live/vmlinuz boot=live components nomodeset",
              "initrd /live/initrd.img", "",
              "title Return to Windows Boot Manager",
              "find --set-root --ignore-floppies /bootmgr",
              "chainloader /bootmgr", ""
            )
            [System.IO.File]::WriteAllText("C:\menu.lst", ($menuLines -join "`n"), (New-Object System.Text.ASCIIEncoding))
            Remove-OldAetherBcdEntries
            $createOut = (& bcdedit /create /d "AetherOS 1.0 LTS (No-Pendrive)" /application bootsector) -join "`n"
            if ($createOut -match '(\{[0-9a-fA-F\-]+\})') { $biosGuid = $Matches[1] } else { throw "Failed to create Legacy BIOS BCD entry: $createOut" }
            & bcdedit /set $biosGuid device "partition=C:" | Out-Null
            & bcdedit /set $biosGuid path "\grldr.mbr" | Out-Null
            & bcdedit /displayorder $biosGuid /addlast | Out-Null
            & bcdedit /timeout 10 | Out-Null
            & bcdedit /set '{bootmgr}' displaybootmenu yes | Out-Null
            Write-Host "[READY] AetherOS 1.0 LTS staged for Legacy BIOS + MBR on C:\! Click Start -> Restart and choose AetherOS." -ForegroundColor Green
            exit 0
          }

          if ($disk.PartitionStyle -eq "MBR" -and $allParts.Count -ge 4) {
            Restore-CDriveUnallocated
            throw "Disk $($disk.Number) is MBR with $($allParts.Count)/4 primary partitions (MBR limit = 4). Unallocated space restored to C:\. Flash $IsoPath to USB with Rufus/Ventoy or convert Disk $($disk.Number) to GPT."
          }
          Write-Host "[OK] UEFI + $($disk.PartitionStyle) disk verified." -ForegroundColor Green

          $existingStage = Get-Volume -FileSystemLabel "AETHER_BOOT" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($existingStage) {
            $stageLetter = $existingStage.DriveLetter
            if (-not $stageLetter) {
              $existingPart = $existingStage | Get-Partition | Select-Object -First 1
              $existingPart | Add-PartitionAccessPath -AssignDriveLetter
              Start-Sleep -Seconds 1
              $stageLetter = ($existingPart | Get-Volume).DriveLetter
            }
            Write-Host "[OK] Reusing existing AETHER_BOOT partition at ${stageLetter}: (formatting fresh FAT32)..." -ForegroundColor Green
            Format-Volume -DriveLetter $stageLetter -FileSystem FAT32 -NewFileSystemLabel "AETHER_BOOT" -Confirm:$false | Out-Null
            $stageDrive = "${stageLetter}:"
          } else {
            $cPart = Get-Partition -DriveLetter C
            $disk = Get-Disk -Number $cPart.DiskNumber
            $minStageBytes = [int64]2500 * 1MB
            $targetStageBytes = [int64]3500 * 1MB
            if ($disk.LargestFreeExtent -ge $minStageBytes) {
              Write-Host "[OK] Found $([Math]::Round($disk.LargestFreeExtent / 1GB, 2)) GB unallocated space on Disk $($cPart.DiskNumber) - skipping C:\ shrink." -ForegroundColor Green
            } else {
              $supported = Get-PartitionSupportedSize -DriveLetter C
              $shrinkBytes = if ($ReplaceWindows) { [int64]4200 * 1MB } else { [int64]([Math]::Max($AllocateGB, 20)) * 1GB }
              $maxShrinkBytes = $cPart.Size - $supported.SizeMin
              if ($maxShrinkBytes -lt $shrinkBytes) {
                $availGB = [Math]::Floor($maxShrinkBytes / 1GB)
                $needGB = [Math]::Ceiling($shrinkBytes / 1GB)
                throw "Not enough contiguous free space on C:\ to shrink by ${needGB} GB (Windows allows max ${availGB} GB). Enter a smaller GB value or choose Mode 2."
              }
              $targetSize = $cPart.Size - $shrinkBytes
              Write-Host "[DISK] Shrinking C:\ by $([Math]::Round($shrinkBytes / 1GB, 1)) GB..." -ForegroundColor Yellow
              Resize-Partition -DriveLetter C -Size $targetSize
              Start-Sleep -Seconds 2
              Update-HostStorageCache
              $disk = Get-Disk -Number $cPart.DiskNumber
            }
            Write-Host "[DISK] Creating FAT32 staging partition (AETHER_BOOT)..." -ForegroundColor Yellow
            if ($ReplaceWindows -or $disk.LargestFreeExtent -le ([int64]5 * 1GB)) {
              $stagePart = New-Partition -DiskNumber $cPart.DiskNumber -UseMaximumSize -AssignDriveLetter
            } else {
              $createSize = [Math]::Min($targetStageBytes, $disk.LargestFreeExtent - ([int64]16 * 1MB))
              $stagePart = New-Partition -DiskNumber $cPart.DiskNumber -Size $createSize -AssignDriveLetter
            }
            Start-Sleep -Seconds 1
            Format-Volume -DriveLetter $stagePart.DriveLetter -FileSystem FAT32 -NewFileSystemLabel "AETHER_BOOT" -Confirm:$false | Out-Null
            $stageDrive = "$($stagePart.DriveLetter):"
            Write-Host "[OK] Staging partition ready at $stageDrive" -ForegroundColor Green
          }

          Write-Host "[ISO] Mounting ISO and copying AetherOS live image to $stageDrive (1-2 minutes)..." -ForegroundColor Cyan
          $mountInfo = Mount-AetherIsoDrive -Path $IsoPath
          try {
            $isoDrive = $mountInfo.Drive
            $live = Find-AetherIsoLiveFiles -IsoDrive $isoDrive
            Copy-Item -Path "$isoDrive\*" -Destination "$stageDrive\" -Recurse -Force
            Get-ChildItem -LiteralPath "$stageDrive\live" -File -ErrorAction SilentlyContinue | ForEach-Object { $_.IsReadOnly = $false }
            if (-not (Test-Path -LiteralPath "$stageDrive\live\filesystem.squashfs")) {
              $copiedSquash = Get-ChildItem -LiteralPath "$stageDrive\live" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -imatch '\.(squashfs|squ)$' -or ($_.Name -imatch '^filesys' -and $_.Length -gt 10MB) -or $_.Length -gt 100MB } | Sort-Object Length -Descending | Select-Object -First 1
              if ($copiedSquash) { Rename-Item -LiteralPath $copiedSquash.FullName -NewName "filesystem.squashfs" -Force }
            }
          } finally {
            if ($mountInfo.WeMounted) { Dismount-DiskImage -ImagePath $IsoPath -ErrorAction SilentlyContinue | Out-Null }
          }
          Write-Host "[OK] AetherOS boot files copied to $stageDrive." -ForegroundColor Green

          $efiPath = "\EFI\BOOT\BOOTX64.EFI"
          if (-not (Test-Path -LiteralPath "$stageDrive$efiPath")) {
            $altEfi = Get-ChildItem -Path "$stageDrive\EFI" -Filter "*.efi" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($altEfi) { $efiPath = $altEfi.FullName.Substring(2) } else { throw "EFI bootloader not found in $stageDrive\EFI." }
          }

          Write-Host "[BOOT] Registering AetherOS UEFI firmware boot entry ($stageDrive$efiPath)..." -ForegroundColor Cyan
          $copyOut = & bcdedit /copy '{bootmgr}' /d "AetherOS 1.0 LTS Installer (No-USB)"
          if ($copyOut -match '(\{[0-9a-fA-F\-]+\})') { $efiGuid = $Matches[1] } else { throw "Failed to create UEFI boot entry: $copyOut" }
          & bcdedit /set $efiGuid device "partition=$stageDrive" | Out-Null
          & bcdedit /set $efiGuid path $efiPath | Out-Null
          try {
            & bcdedit /set '{fwbootmgr}' displayorder $efiGuid /addfirst | Out-Null
          } catch {
            & bcdedit /displayorder $efiGuid /addfirst | Out-Null
          }

          Write-Host "[READY] AetherOS 1.0 LTS staged on $stageDrive! Restart PC (disable Secure Boot in BIOS if prompted)." -ForegroundColor Green
          PS1_EOF

            cat <<'ISO_EOF' > aetheros-src/build/build-iso.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DISTRO_VERSION="1.0-lts"
          DEBIAN_SUITE="bookworm"
          ARCH="amd64"
          WORK_DIR="${PWD}/work"
          CHROOT_DIR="${WORK_DIR}/chroot"
          ISO_DIR="${WORK_DIR}/iso"
          OUTPUT_ISO="${PWD}/aetheros-${DISTRO_VERSION}-x86_64.iso"

          cleanup() {
            for mp in dev/pts dev proc sys; do
              mountpoint -q "${CHROOT_DIR}/${mp}" 2>/dev/null && umount -lf "${CHROOT_DIR}/${mp}" || true
            done
          }
          trap cleanup EXIT

          rm -rf "${WORK_DIR}"
          mkdir -p "${CHROOT_DIR}" "${ISO_DIR}/live" "${ISO_DIR}/boot/grub"

          debootstrap --arch="${ARCH}" --variant=minbase \
            --include=systemd,systemd-sysv,dbus,ca-certificates,gnupg,curl,locales,sudo \
            "${DEBIAN_SUITE}" "${CHROOT_DIR}" http://deb.debian.org/debian/

          cat > "${CHROOT_DIR}/etc/apt/sources.list" <<EOF
          deb http://deb.debian.org/debian ${DEBIAN_SUITE} main contrib non-free non-free-firmware
          deb http://security.debian.org/debian-security ${DEBIAN_SUITE}-security main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian ${DEBIAN_SUITE}-updates main contrib non-free non-free-firmware
          deb http://deb.debian.org/debian ${DEBIAN_SUITE}-backports main contrib non-free non-free-firmware
          EOF

          mount --bind /dev "${CHROOT_DIR}/dev"
          mount --bind /dev/pts "${CHROOT_DIR}/dev/pts"
          mount -t proc proc "${CHROOT_DIR}/proc"
          mount -t sysfs sysfs "${CHROOT_DIR}/sys"

          chroot "${CHROOT_DIR}" /bin/bash -e <<'CHROOT_EOF'
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture i386
          apt-get update
          apt-get upgrade -y
          apt-get install -y --no-install-recommends \
            zstd linux-image-amd64
          apt-get install -y --no-install-recommends \
            firmware-linux firmware-iwlwifi firmware-amd-graphics firmware-misc-nonfree \
            live-boot initramfs-tools grub-efi-amd64-signed shim-signed grub-pc-bin \
            plymouth plymouth-themes
          apt-get install -y --no-install-recommends \
            polkitd network-manager bluez pipewire pipewire-pulse pipewire-jack \
            wireplumber zram-tools nftables apparmor apparmor-utils \
            unattended-upgrades ntfs-3g cifs-utils fuse3 flatpak p7zip-full unzip \
            cryptsetup parted dosfstools
          apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers mesa-vulkan-drivers:i386 \
            libvulkan1 libvulkan1:i386 vulkan-tools mesa-va-drivers \
            intel-media-va-driver-non-free vainfo
          apt-get install -y --no-install-recommends \
            xserver-xorg xserver-xorg-core xserver-xorg-video-all \
            xserver-xorg-input-all xserver-xorg-input-libinput xinit dbus-x11 \
            xfce4 xfce4-terminal thunar gvfs udisks2 policykit-1-gnome \
            network-manager-gnome pavucontrol arc-theme adwaita-icon-theme \
            sddm sddm-theme-debian-maui qml-module-qtquick2 \
            qml-module-qtquick-window2 qml-module-qtquick-controls \
            qml-module-qtquick-layouts \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-window xwayland python3 python3-pyqt6 \
            fonts-noto-core fonts-liberation
          apt-get install -y --no-install-recommends \
            wine wine64 wine32:i386 winetricks cabextract
          grep -qxF 'ntfs3' /etc/initramfs-tools/modules || echo 'ntfs3' >> /etc/initramfs-tools/modules
          grep -qxF 'fuse' /etc/initramfs-tools/modules || echo 'fuse' >> /etc/initramfs-tools/modules
          update-initramfs -u -k all
          systemctl set-default graphical.target || true
          systemctl enable NetworkManager bluetooth nftables apparmor fstrim.timer zramswap sddm || true
          echo "PERCENT=50" > /etc/default/zramswap
          echo "ALGO=lz4" >> /etc/default/zramswap
          echo "aetheros" > /etc/hostname
          for g in sudo video audio render plugdev; do
            getent group "${g}" >/dev/null || groupadd "${g}"
          done
          id -u aether >/dev/null 2>&1 || useradd -m -s /bin/bash -G sudo,video,audio,render,plugdev aether
          echo "aether:aether" | chpasswd
          echo "aether ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/aether-live
          mkdir -p /etc/sddm.conf.d /home/aether/Desktop
          cat > /etc/sddm.conf <<'SDDM_EOF'
          [Autologin]
          User=aether
          Session=xfce.desktop
          Relogin=false

          [Theme]
          Current=debian-maui
          SDDM_EOF
          cp /etc/sddm.conf /etc/sddm.conf.d/aetheros-autologin.conf
          cat > /home/aether/Desktop/Terminal.desktop <<'DESK_EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Aether Terminal
          Exec=xfce4-terminal
          Icon=utilities-terminal
          Terminal=false
          DESK_EOF
          cat > /home/aether/Desktop/Files.desktop <<'DESK_EOF'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Files
          Exec=thunar
          Icon=system-file-manager
          Terminal=false
          DESK_EOF
          chmod +x /home/aether/Desktop/*.desktop
          chown -R aether:aether /home/aether
          test -f /usr/share/xsessions/xfce.desktop
          command -v Xorg >/dev/null
          apt-get clean
          rm -rf /var/lib/apt/lists/* /tmp/* /usr/share/doc/* /usr/share/man/*
          CHROOT_EOF

          [[ -f ../security/nftables.conf ]] && install -m 0644 ../security/nftables.conf "${CHROOT_DIR}/etc/nftables.conf"
          mkdir -p "${CHROOT_DIR}/usr/local/share/aetheros"
          for d in adobe-manager arch desktop docs drivers installer security storage; do
            [[ -d "../${d}" ]] && cp -r "../${d}" "${CHROOT_DIR}/usr/local/share/aetheros/"
          done
          VMLINUZ_PATH="$(ls -1t "${CHROOT_DIR}"/boot/vmlinuz-* | head -n 1)"
          INITRD_PATH="$(ls -1t "${CHROOT_DIR}"/boot/initrd.img-* | head -n 1)"
          cp -L "${VMLINUZ_PATH}" "${ISO_DIR}/live/vmlinuz"
          cp -L "${INITRD_PATH}" "${ISO_DIR}/live/initrd.img"
          cleanup

          mksquashfs "${CHROOT_DIR}" "${ISO_DIR}/live/filesystem.squashfs" \
            -comp zstd -Xcompression-level 6 -b 1M -no-exports -noappend
          cp ./grub.cfg "${ISO_DIR}/boot/grub/grub.cfg"
          mkdir -p "${ISO_DIR}/EFI/BOOT"
          grub-mkstandalone -O x86_64-efi -o "${ISO_DIR}/EFI/BOOT/BOOTX64.EFI" \
            "boot/grub/grub.cfg=${ISO_DIR}/boot/grub/grub.cfg" || true
          grub-mkrescue -o "${OUTPUT_ISO}" "${ISO_DIR}" -- \
            -volid "AETHEROS_1_0_LTS" \
            -J -joliet-long -iso-level 3
          ls -lh "${OUTPUT_ISO}"
          ISO_EOF
            sed -i 's/^          //' aetheros-src/build/grub.cfg aetheros-src/security/nftables.conf aetheros-src/installer/Install-AetherOS-DoubleClick.bat aetheros-src/installer/AetherOS-Windows-NoUSB-Installer.ps1 aetheros-src/build/build-iso.sh
            chmod +x aetheros-src/build/build-iso.sh
            echo "BUILD_ROOT=aetheros-src" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Bootable AetherOS ISO (Debian Bookworm Minimal + Linux LTS)
        run: |
          cd "${{ steps.prep.outputs.BUILD_ROOT }}/build"
          chmod +x ./build-iso.sh
          sudo ./build-iso.sh
          sha256sum aetheros-*.iso > SHA256SUMS.txt
          ls -lh aetheros-*.iso SHA256SUMS.txt

      - name: Collect release assets (ISO + Checksum + Windows Double-Click Setup)
        run: |
          mkdir -p release-assets
          cp "${{ steps.prep.outputs.BUILD_ROOT }}"/build/aetheros-*.iso release-assets/
          cp "${{ steps.prep.outputs.BUILD_ROOT }}"/build/SHA256SUMS.txt release-assets/
          if [[ -f "${{ steps.prep.outputs.BUILD_ROOT }}/installer/Install-AetherOS-DoubleClick.bat" ]]; then
            cp "${{ steps.prep.outputs.BUILD_ROOT }}/installer/Install-AetherOS-DoubleClick.bat" release-assets/
          fi
          if [[ -f "${{ steps.prep.outputs.BUILD_ROOT }}/installer/AetherOS-Windows-NoUSB-Installer.ps1" ]]; then
            cp "${{ steps.prep.outputs.BUILD_ROOT }}/installer/AetherOS-Windows-NoUSB-Installer.ps1" release-assets/
          fi
          ls -lh release-assets/

      - name: Upload ISO as GitHub Actions Artifact
        uses: actions/upload-artifact@v6
        with:
          name: aetheros-1.0-lts-iso
          path: release-assets/*
          retention-days: 14

      - name: Publish Bootable ISO to GitHub Releases
        if: ${{ inputs.publish_release != false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="aetheros-1.0-lts-$(date +%Y%m%d-%H%M%S)"
          fi

          gh release create "${TAG}" release-assets/* \
            --title "AetherOS 1.0 LTS (${TAG})" \
            --notes "Bootable Debian Bookworm Minimal + Linux LTS x86_64 ISO (UEFI Secure Boot + Legacy BIOS) with Wine/DXVK, Qt6, PipeWire, and Windows No-Pendrive Double-Click Setup (.bat + .ps1)."
