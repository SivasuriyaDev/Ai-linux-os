#!/usr/sbin/nft -f
# AetherOS Default Host Firewall Policy (nftables)
# Default-drop inbound policy, full loopback & established/related return traffic.

flush ruleset

table inet aether_filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback interface
        iifname "lo" accept

        # Allow established and related inbound connections
        ct state established,related accept

        # Drop invalid packets early
        ct state invalid drop

        # Allow essential ICMP / ICMPv6 diagnostics & neighbor discovery
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Allow mDNS for local NAS/SMB discovery and printers
        udp dport 5353 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
